<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>¿Andar o bus? — Cádiz</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Andar o bus" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --walk: #16a34a;
    --walk-soft: #ecfdf3;
    --bus-wait: #d97706;
    --bus-wait-soft: #fffbeb;
    --bus-route: #2563eb;
    --muted: #9ca3af;
    --ink: #111827;
    --ink-soft: #6b7280;
    --surface: #ffffff;
    --surface-soft: #f3f4f6;
    --line: #ececef;
    --radius-lg: 26px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-float: 0 8px 24px rgba(17,24,39,.14);
    --shadow-sheet: 0 -10px 34px rgba(17,24,39,.16);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--ink); }
  .icon svg { display: block; }

  /* ---- search ---- */
  #search-box { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 1000; }
  #search { position: relative; }
  #search .icon.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
  #search input { width: 100%; font-size: 16px; padding: 14px 16px 14px 44px; border: none; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-float); outline: none; color: var(--ink); }
  #search input::placeholder { color: var(--ink-soft); }
  #search input:focus { box-shadow: var(--shadow-float), 0 0 0 2px var(--walk); }
  #search button { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  #dropdown { margin-top: 8px; background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-float); overflow: hidden; max-height: 280px; overflow-y: auto; }
  .dropdown-header { padding: 10px 16px 4px; font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .08em; text-transform: uppercase; }
  .dropdown-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-top: 1px solid var(--line); }
  .dropdown-item:first-of-type { border-top: none; }
  .dropdown-item:hover, .dropdown-item:active { background: var(--surface-soft); }
  .dropdown-item .icon { flex-shrink: 0; color: var(--ink-soft); }
  .dropdown-item .text { flex: 1; min-width: 0; }
  .dropdown-item .main { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dropdown-item .sub { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dropdown-item.favorite-item { padding-right: 44px; position: relative; }
  .remove-fav { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--muted); font-size: 15px; line-height: 1; padding: 10px; cursor: pointer; }
  .remove-fav:hover { color: #ef4444; }
  .quick-verdict { font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; color: var(--muted); }
  .quick-verdict.bus { color: var(--bus-wait); }
  .quick-verdict.walk { color: var(--walk); }
  .hidden { display: none !important; }

  /* ---- bottom sheet ---- */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: var(--shadow-sheet); }
  #sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 12px; }
  #sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #dest-name { font-size: 15px; font-weight: 700; color: var(--ink-soft); letter-spacing: .01em; }
  #status { font-size: 15px; color: var(--ink-soft); padding: 4px 0; }
  #fav-toggle { border: none; background: none; color: var(--muted); cursor: pointer; padding: 4px; line-height: 0; }
  #fav-toggle.active { color: var(--bus-wait); }
  #skip-locate { display: block; margin: 6px 0 2px; border: none; background: none; color: var(--bus-route); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }

  #decision { margin-top: 6px; }
  .decision-card { border-radius: var(--radius-md); padding: 18px; }
  .decision-card.bus { background: var(--bus-wait-soft); }
  .decision-card.walk { background: var(--walk-soft); }
  .decision-mode { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .decision-card.bus .decision-mode { color: var(--bus-wait); }
  .decision-card.walk .decision-mode { color: var(--walk); }
  .decision-line { margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .decision-wait { margin-top: 2px; font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--ink); letter-spacing: -.02em; }
  .decision-wait .unit { font-size: 18px; font-weight: 700; color: var(--ink-soft); margin-left: 2px; }
  .decision-sub { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .decision-sub .icon { color: var(--bus-route); }
  .decision-alt { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-soft); padding-left: 2px; }
  .decision-alt .icon { color: var(--muted); }
  .decision-empty { padding: 18px 2px; color: var(--ink-soft); font-size: 15px; }
  .decision-error { padding: 18px 2px; color: #b91c1c; font-size: 15px; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--walk); border-radius: 50%; vertical-align: -2px; margin-right: 6px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="search-box">
  <form id="search">
    <span class="icon search-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <input id="q" placeholder="¿A dónde vas?" autocomplete="off" />
    <button type="submit">Ir</button>
  </form>
  <div id="dropdown" class="hidden"></div>
</div>
<div id="sheet">
  <div id="sheet-handle"></div>
  <div id="sheet-header">
    <div id="dest-name"></div>
    <button id="fav-toggle" type="button" class="hidden" aria-label="Guardar como destino habitual"></button>
  </div>
  <div id="status">Localizando…</div>
  <button id="skip-locate" type="button" class="hidden">Seguir sin ubicación</button>
  <div id="decision"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initUI } from './web/ui.js';
initUI();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
