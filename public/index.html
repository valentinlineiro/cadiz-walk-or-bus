<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>¿Andar o bus? — Cádiz</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Andar o bus" />
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root {
    --walk: #16a34a;
    --walk-soft: #ecfdf3;
    --walk-border: #bbf7d0;
    --bus: #2563eb;
    --bus-wait: #d97706;
    --bus-wait-soft: #fffbeb;
    --bus-wait-border: #fde68a;
    --ink: #0f172a;
    --ink-soft: #475569;
    --muted: #94a3b8;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --line: #e2e8f0;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-sheet: 0 -12px 36px rgba(15, 23, 42, 0.14);
    --shadow-card: 0 4px 14px rgba(15, 23, 42, 0.06);
    --shadow-float: 0 8px 24px rgba(15, 23, 42, 0.12);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #map { height: 100%; margin: 0; padding: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--surface-soft); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .icon svg { display: block; }
  .hidden { display: none !important; }

  /* Full-screen Leaflet map */
  #map { position: absolute; inset: 0; z-index: 1; }
  /* viewport-fit=cover: keep the OSM credit out from under the notch / status bar */
  .leaflet-top.leaflet-right { margin-top: env(safe-area-inset-top, 0px); }

  /* Bottom Sheet */
  #sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1000;
    background: var(--surface);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-sheet);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), max-height 0.25s ease;
  }
  #sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    margin: 2px auto 14px;
    flex-shrink: 0;
  }

  /* Sheet Header & Search Trigger */
  #sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
  #dest-name { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  .btn-icon {
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 50%;
    padding: 0;
  }
  .btn-icon:hover { color: var(--ink); background: var(--surface-soft); }
  .btn-icon:focus-visible { outline: 2px solid var(--walk); outline-offset: 2px; }
  #fav-toggle.active { color: var(--bus-wait); }

  #btn-change-dest {
    background: var(--surface-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #btn-change-dest:hover { background: var(--line); }
  #btn-change-dest:focus-visible { outline: 2px solid var(--walk); outline-offset: 2px; }

  #status { font-size: 14px; color: var(--ink-soft); padding: 2px 0 6px; min-height: 24px; }
  #skip-locate { display: inline-block; margin: 4px 0 6px; border: none; background: none; color: var(--bus); font-size: 14px; font-weight: 600; cursor: pointer; padding: 10px 0; min-height: 44px; }
  #skip-locate:focus-visible { outline: 2px solid var(--walk); outline-offset: 2px; }

  /* Integrated Search Input within Sheet / Expanded */
  #search-container { margin: 6px 0 10px; position: relative; }
  #search-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
    min-height: 48px;
  }
  #home-favorites { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .home-fav {
    flex: 0 0 auto; max-width: 60vw; min-height: 44px; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; background: var(--surface-soft); border: 1px solid var(--line);
    border-radius: 22px; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    cursor: pointer; scroll-snap-align: start;
  }
  .home-fav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .home-fav .quick-verdict { min-width: 2ch; text-align: right; }
  #search-trigger:focus-visible { outline: 2px solid var(--walk); outline-offset: 2px; }

  #search-form { display: flex; align-items: center; gap: 8px; position: relative; }
  .search-input-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-input-wrap .search-icon {
    position: absolute;
    left: 14px;
    color: var(--muted);
    pointer-events: none;
  }
  #q {
    width: 100%;
    font-size: 16px;
    padding: 12px 40px 12px 42px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--ink);
    outline: none;
    min-height: 48px;
  }
  #q:focus { border-color: var(--walk); background: var(--surface); box-shadow: 0 0 0 3px rgba(22,163,74,0.15); }
  #clear-search {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
  }
  #clear-search:focus-visible { outline: 2px solid var(--walk); outline-offset: 2px; }
  #btn-cancel-search {
    border: none;
    background: none;
    color: var(--bus);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    padding: 0 8px;
    white-space: nowrap;
  }
  #btn-cancel-search:focus-visible { outline: 2px solid var(--walk); outline-offset: 2px; }

  /* Dropdown & Quick Picks */
  #dropdown {
    margin-top: 8px;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    overflow: hidden;
    max-height: 42vh;
    overflow-y: auto;
  }
  .dropdown-header {
    padding: 10px 16px 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: .08em;
    text-transform: uppercase;
    background: var(--surface-soft);
    border-bottom: 1px solid var(--line);
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    border-top: 1px solid var(--line);
    min-height: 48px;
  }
  .dropdown-select {
    flex: 1; min-width: 0; align-self: stretch;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    background: none; border: none; font: inherit; color: inherit; text-align: left;
    cursor: pointer;
  }
  .dropdown-select:focus-visible, .remove-fav:focus-visible { outline: 2px solid var(--walk); outline-offset: -2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); margin: -1px; white-space: nowrap; }
  .quick-verdict svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }
  .dropdown-item:first-of-type { border-top: none; }
  .dropdown-item:hover, .dropdown-item:active { background: var(--surface-soft); }
  .dropdown-item .icon { flex-shrink: 0; color: var(--ink-soft); }
  .dropdown-item .text { flex: 1; min-width: 0; }
  .dropdown-item .main { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dropdown-item .sub { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dropdown-item.favorite-item { padding-right: 48px; position: relative; }
  .dropdown-item.favorite-item .dropdown-select { padding-right: 0; }
  .remove-fav {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--muted);
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .remove-fav:hover { color: var(--danger); }
  .quick-verdict { font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0; color: var(--muted); }
  .quick-verdict.bus { color: var(--bus-wait); }
  .quick-verdict.walk { color: var(--walk); }

  /* Decision-First Cards */
  #decision { margin-top: 4px; }
  .decision-card {
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    position: relative;
    border: 1px solid transparent;
  }
  .decision-card.bus { background: var(--bus-wait-soft); border-color: var(--bus-wait-border); }
  .decision-card.walk { background: var(--walk-soft); border-color: var(--walk-border); }
  
  .decision-mode {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .decision-card.bus .decision-mode { color: var(--bus-wait); }
  .decision-card.walk .decision-mode { color: var(--walk); }

  .decision-line { margin-top: 8px; font-size: 15px; font-weight: 700; color: var(--ink); }
  .decision-source { margin-top: 5px; font-size: 12px; color: var(--ink-soft); }
  .decision-wait {
    margin-top: 2px;
    font-size: 42px;
    font-weight: 800;
    line-height: 1.05;
    color: var(--ink);
    letter-spacing: -0.03em;
  }
  .decision-wait .unit { font-size: 18px; font-weight: 700; color: var(--ink-soft); margin-left: 2px; }

  .decision-alt {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 8px 12px;
    background: var(--surface-soft);
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
  }
  .decision-alt .icon { color: var(--muted); }
  .decision-explanation { margin: 10px 4px 0; color: var(--ink-soft); font-size: 14px; font-weight: 600; }
  .start-journey { margin-top: 14px; width: 100%; min-height: 42px; border: 0; border-radius: var(--radius-sm); background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; }
  .start-journey:disabled { background: var(--muted); cursor: default; }
  .alt-source { margin-top: 3px; color: var(--ink-soft); font-size: 11px; }

  .alternatives-container {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .alternatives-heading {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .alternative-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px 14px;
    background: var(--surface-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .alternative-card:hover {
    background: var(--surface);
    border-color: var(--muted);
  }
  .alternative-card:focus-visible {
    outline: 2px solid var(--bus);
    outline-offset: 2px;
  }
  .alt-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .alt-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }
  .alt-title .icon {
    display: inline-flex;
  }
  .alt-desc {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .alt-right {
    text-align: right;
  }
  .alt-time {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .alt-delta {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .journey-timeline {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow-x: auto;
  }
  .journey-timeline .segment {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
  .journey-timeline .segment:not(:first-child) { padding-left: 10px; border-left: 1px solid var(--line); }
  .journey-timeline .segment.walk .icon { color: var(--walk); }
  .journey-timeline .segment.wait .icon { color: var(--bus-wait); }
  .journey-timeline .segment.bus .icon { color: var(--bus); }

  .decision-empty { padding: 18px 4px; color: var(--ink-soft); font-size: 15px; }
  .decision-card.no-data { background: var(--surface-2, #f3f4f6); border-color: var(--border, #d1d5db); }
  .decision-card.no-data .decision-mode { color: var(--text-muted, #4b5563); }
  .decision-fact { margin-top: 8px; font-size: 14px; color: var(--text-muted, #4b5563); }
  .decision-note { margin-top: 10px; padding: 10px 12px; font-size: 13px; border-radius: var(--radius-md); background: var(--surface-2, #f3f4f6); color: var(--text-muted, #4b5563); }
  .decision-error { padding: 16px 18px; background: var(--danger-soft); color: #991b1b; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--walk);
    border-radius: 50%;
    vertical-align: -2px;
    margin-right: 6px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"></div>

<div id="sheet" aria-label="Panel de ruta">
  <div id="sheet-handle" aria-hidden="true"></div>
  <div id="sheet-header">
    <div id="dest-name"></div>
    <div class="header-actions">
      <button id="fav-toggle" type="button" class="btn-icon hidden" aria-label="Guardar como destino habitual"></button>
      <button id="btn-change-dest" type="button" class="hidden">Cambiar destino</button>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite">Localizando…</div>
  <button id="skip-locate" type="button" class="hidden">Seguir sin ubicación</button>

  <div id="search-container">
    <button id="search-trigger" type="button" class="hidden">
      <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <span>¿A dónde vas?</span>
    </button>
    <div id="home-favorites" class="hidden" role="group" aria-label="Destinos habituales"></div>
    <form id="search-form" class="hidden">
      <div class="search-input-wrap">
        <span class="icon search-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input id="q" placeholder="¿A dónde vas?" autocomplete="off" />
        <button id="clear-search" type="button" class="hidden" aria-label="Borrar búsqueda">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <button id="btn-cancel-search" type="button">Cancelar</button>
    </form>
    <div id="dropdown" class="hidden" role="region" aria-label="Sugerencias de destino"></div>
  </div>

  <div id="decision"></div>
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script type="module">
import { initUI } from './web/ui.js';
initUI();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
